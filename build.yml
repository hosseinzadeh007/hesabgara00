name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project if it was uploaded as a zip
        run: |
          z=$(ls *.zip 2>/dev/null | head -n1 || true)
          if [ -n "$z" ] && [ ! -f settings.gradle.kts ]; then unzip -q "$z" -d proj; fi

      - name: Find project folder
        id: p
        run: |
          f=$(find . -name settings.gradle.kts -not -path './.git/*' | head -n1)
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"

      - name: Set version from tag
        id: v
        run: |
          v="1.0"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; fi
          echo "v=$v" >> "$GITHUB_OUTPUT"
          sed -i "s/var APP_VERSION='[^']*'/var APP_VERSION='$v'/" "${{ steps.p.outputs.dir }}/app/src/main/assets/index.html"
          sed -i "s|var UPDATE_REPO='[^']*'|var UPDATE_REPO='${{ github.repository }}'|" "${{ steps.p.outputs.dir }}/app/src/main/assets/index.html"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: ${{ steps.p.outputs.dir }}
        run: gradle assembleDebug --no-daemon -PvName=${{ steps.v.outputs.v }} -PvCode=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: CafeYar-APK
          path: ${{ steps.p.outputs.dir }}/app/build/outputs/apk/debug/*.apk

      - name: Attach APK to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.p.outputs.dir }}/app/build/outputs/apk/debug/*.apk
